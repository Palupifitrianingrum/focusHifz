<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HifzFlow – Prototype + Cek Bacaan Suara</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Fraunces:wght@600&display=swap" rel="stylesheet">
<style>
:root{--g:#0f5c4a;--g2:#0a3d31;--c:#f7f1e3;--w:#fffdf7;--au:#c9a24b;--t:#1d2b26;--m:#667a71;--r:#c0392b;--y:#d9a400;--ok:#1e8e5a;--ln:#e6dcc3;--az:30px;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--c:#0e1915;--w:#16251f;--t:#efe9d8;--m:#9fb0a8;--ln:#2a3d35;--g:#2f9a7c;color-scheme:dark}}
:root[data-theme=dark]{--c:#0e1915;--w:#16251f;--t:#efe9d8;--m:#9fb0a8;--ln:#2a3d35;--g:#2f9a7c;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}body{background:#cfc8b4;font:15px/1.45 system-ui,sans-serif;color:var(--t)}
#app{max-width:430px;height:100%;margin:auto;background:var(--c);display:flex;flex-direction:column;position:relative;overflow:hidden;padding-top:env(safe-area-inset-top,0)}
#v{flex:1;overflow:auto;padding:16px 16px 28px}#v.foc{background:var(--c)}
h2,h3{font-family:Fraunces,Georgia,serif;margin:0}h2{font-size:24px;line-height:1.2}h3{font-size:19px}h4{margin:18px 0 8px;font-size:15px}
p{margin:6px 0}small,.mu{color:var(--m)}
.hero{background:linear-gradient(150deg,var(--g2),var(--g));color:#fff;border-radius:22px;padding:20px;margin-bottom:14px;border-bottom:3px solid var(--au)}
.hero p{opacity:.9}.hero small{color:#e9dfb8}
.card{background:var(--w);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}.sp2{justify-content:space-between}
.b{border:0;border-radius:14px;padding:13px 16px;font:600 15px system-ui;background:var(--g);color:#fff;width:100%;margin-top:8px;cursor:pointer}
.b.o{background:transparent;color:var(--g);border:1.5px solid var(--g)}.b.au{background:var(--au);color:#2a2108}.b.rd{background:var(--r)}.b[disabled]{opacity:.4}
.ch{border:1.5px solid var(--ln);background:var(--w);color:var(--t);border-radius:99px;padding:8px 14px;font:500 14px system-ui;margin:0 6px 6px 0;cursor:pointer}.ch.on{background:var(--g);color:#fff;border-color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.g2{grid-template-columns:1fr 1fr}
.tile{background:var(--w);border:1px solid var(--ln);border-radius:16px;padding:14px 6px;text-align:center;font:600 13px system-ui;color:var(--t);cursor:pointer}.tile i{display:block;font-style:normal;font-size:24px;margin-bottom:4px}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--au));border-radius:9px}
.bd{font:600 12px system-ui;padding:3px 9px;border-radius:99px;background:var(--ln);color:var(--t)}.bd.g{background:#d5efe1;color:#0f5a37}.bd.y{background:#fbefc2;color:#7a5a00}.bd.r{background:#f6d6d2;color:#8e2418}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:12px}.bk{border:0;background:var(--w);border-radius:12px;width:38px;height:38px;font-size:22px;color:var(--t);cursor:pointer;border:1px solid var(--ln)}
.ar{font-family:Amiri,'Scheherazade New',serif;font-size:var(--az);line-height:2.1;text-align:center;direction:rtl}.ar .nm{font-size:.6em;color:var(--au)}
.mush{background:var(--w);border:2px solid var(--au);border-radius:18px;padding:18px 12px;margin:10px 0;box-shadow:inset 0 0 0 4px var(--c)}
.seg{display:flex;background:var(--ln);border-radius:14px;padding:4px;margin-bottom:12px}.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:11px;font:600 13px system-ui;color:var(--m);cursor:pointer}.seg .on{background:var(--w);color:var(--g)}
.sp{display:flex;align-items:center;gap:10px;margin:8px 0}.sp span{flex:1}.sp button{width:36px;height:36px;border-radius:11px;border:1px solid var(--ln);background:var(--w);color:var(--t);font-size:18px;cursor:pointer}.sp b{min-width:28px;text-align:center}
nav{display:flex;background:var(--w);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0))}nav button{flex:1;border:0;background:none;padding:6px;font:600 12px system-ui;color:var(--m);cursor:pointer}nav i{display:block;font-style:normal;font-size:21px}nav .on{color:var(--g)}
.ov{position:absolute;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:9}.sh{background:var(--w);width:100%;border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0));max-height:85%;overflow:auto}
.ts{position:absolute;left:16px;right:16px;bottom:90px;background:#1d2b26;color:#fff;border-radius:12px;padding:12px;text-align:center;z-index:10;font-size:14px}
.opt{display:block;width:100%;text-align:center;padding:13px;margin-top:8px;border-radius:14px;border:1.5px solid var(--ln);background:var(--w);color:var(--t);font:500 15px system-ui;cursor:pointer}.opt.ar{font:var(--az) Amiri,serif;font-size:24px;line-height:1.8}.opt.ok{background:#d5efe1;border-color:var(--ok);color:#0f5a37}.opt.no{background:#f6d6d2;border-color:var(--r);color:#8e2418}
.fb{background:var(--g2);color:#fff;border-radius:12px;padding:9px 12px;font-size:13px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}.fb button{background:#ffffff22;border:0;color:#fff;border-radius:9px;padding:6px 10px;font-weight:600;cursor:pointer}
.wave{display:flex;gap:3px;height:70px;align-items:center;justify-content:center;margin:14px 0}.wave i{width:5px;height:12px;background:var(--g);border-radius:4px}.wave.on i{animation:w .8s ease-in-out infinite alternate}@keyframes w{to{height:64px}}
.tg{width:52px;height:30px;border-radius:99px;background:var(--ln);position:relative;border:0;cursor:pointer;flex:none}.tg:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--g)}.tg.on:after{left:25px}
.big{font:600 46px Fraunces,serif;text-align:center}.cert{border:3px double var(--au);background:#fffdf3;color:#2b2410;border-radius:6px;padding:22px 16px;text-align:center}.cert h2{color:#0a3d31}
.blur{filter:blur(9px);user-select:none}.mk{display:flex;gap:6px;margin-top:6px}.mk button{flex:1;border:1.5px solid var(--ln);background:var(--w);border-radius:10px;padding:8px 2px;font:600 12px system-ui;color:var(--t);cursor:pointer}.mk .g{background:#d5efe1;border-color:var(--ok)}.mk .y{background:#fbefc2;border-color:var(--y)}.mk .r{background:#f6d6d2;border-color:var(--r)}
.emp{text-align:center;padding:18px;color:var(--m)}

.wd{display:inline-block;padding:0 8px;margin:0 2px;border-radius:9px}
.wd.ok{background:#d5efe1;color:#0f5a37}.wd.bad{background:#f6d6d2;color:#8e2418}.wd.miss,.wd.near{background:#fbefc2;color:#7a5a00}
.ta{width:100%;min-height:84px;border:1.5px solid var(--ln);border-radius:12px;padding:10px;background:var(--w);color:var(--t);font:22px/1.8 Amiri,serif;direction:rtl;margin:8px 0}
.er{font-size:13px;color:var(--m);margin:4px 0}.er b{font-family:Amiri,serif;font-size:18px;color:var(--t)}
</style></head><body><div id="app"></div>
<script>
const SU=[{n:'Al-Fatihah',a:['بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ','الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ','الرَّحْمَٰنِ الرَّحِيمِ','مَالِكِ يَوْمِ الدِّينِ','إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ','اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ','صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ']},{n:'Al-Ikhlas',a:['قُلْ هُوَ اللَّهُ أَحَدٌ','اللَّهُ الصَّمَدُ','لَمْ يَلِدْ وَلَمْ يُولَدْ','وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ']}];
const V=[];SU.forEach((s,i)=>s.a.forEach((t,j)=>V.push({s:i,n:j+1,t})));
const HK=[{q:'Lam pada "ال" di kata ini dibaca…',t:'الْحَمْدُ',r:'Alif Lam Qamariyah'},{q:'Lam pada "ال" di kata ini dibaca…',t:'الرَّحْمَٰنِ',r:'Alif Lam Syamsiyah'},{q:'Nun sukun bertemu huruf ع. Hukumnya…',t:'أَنْعَمْتَ',r:'Izhar Halqi'},{q:'Huruf د yang sukun di kata ini dibaca…',t:'لَمْ يَلِدْ',r:'Qalqalah'},{q:'Mad pada alif sebelum lam bertasydid di kata ini disebut…',t:'الضَّالِّينَ',r:'Mad Lazim'}];
const HP=['Alif Lam Qamariyah','Alif Lam Syamsiyah','Izhar Halqi','Qalqalah','Mad Lazim','Ikhfa'];
const TJ=[['Alif Lam Qamariyah','Lam pada "ال" dibaca jelas bila diikuti huruf qamariyah, mis. ح, ع, ك, م. Contoh: الْحَمْدُ.'],['Alif Lam Syamsiyah','Lam melebur ke huruf sesudahnya bila diikuti huruf syamsiyah, mis. ر, ص, ض, ت. Contoh: الرَّحْمَٰنِ.'],['Izhar Halqi','Nun sukun/tanwin bertemu huruf halq (ء ه ع ح غ خ) dibaca jelas tanpa dengung. Contoh: أَنْعَمْتَ.'],['Qalqalah','Huruf ق ط ب ج د yang sukun dibunyikan memantul. Contoh: يَلِدْ.'],['Mad Lazim','Huruf mad diikuti sukun asli atau tasydid dalam satu kata, dipanjangkan 6 harakat. Contoh: الضَّالِّينَ.'],['Ikhfa','Nun sukun/tanwin bertemu 15 huruf ikhfa dibaca samar disertai dengung.']];
const L=[{n:'Level 1 · Hafalan surah pilihan',d:'Menghafal satu surah pilihan dengan lancar.',rq:[['Menghafal minimal satu surah pilihan',()=>G.tot>=4],['Lulus ujian sambung ayat (minimal 60%)',()=>C.own.length>0],['Muraja\'ah rutin 7 hari berturut-turut',()=>false]]},{n:'Level 2 · Hafalan beberapa surah',d:'Rincian persyaratan menyusul sesuai kurikulum.',rq:[],lock:1},{n:'Level 3 · Hafalan juz',d:'Rincian persyaratan menyusul sesuai kurikulum.',rq:[],lock:1}];
let G={name:'Ahmad Fauzi',tot:14,today:2,tgt:5,til:35};
let M=[{s:0,n:2,st:'ulang',due:'Hari ini',err:3},{s:0,n:6,st:'belajar',due:'Besok',err:1},{s:1,n:3,st:'lancar',due:'3 hari lagi',err:0},{s:1,n:1,st:'belajar',due:'Hari ini',err:2},{s:0,n:4,st:'lancar',due:'Minggu ini',err:0}];
let F='all',LG=[{t:'Muraja\'ah Al-Fatihah : 2',d:'Kemarin'},{t:'Tilawah 15 menit',d:'2 hari lalu'}],P={notif:1,rem:1,th:'auto'},C={own:[],hist:[]};
let T={m:'bebas',s:0,f:1,t:7,p:1,min:15,left:900,run:0,el:0,u:'Ayat',n:5,d:0},H={st:'pick',s:0,f:1,t:3,rep:5,cu:0,focus:0,c:0,hide:0,peek:0,rec:0,rt:0,mk:{},ab:0},Q=null;
let S={tab:'home',scr:'',st:[],m:null,ts:'',tj:-1,sl:0,ec:0};
const $=s=>document.querySelector(s),cl=(x,a,b)=>Math.max(a,Math.min(b,x)),rnd=a=>a[Math.floor(Math.random()*a.length)],sh=a=>[...a].sort(()=>Math.random()-.5),W=t=>t.split(' ');
const dt=()=>new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const mm=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const ay=(s,f,t)=>SU[s].a.slice(f-1,t).map((x,i)=>x+` <span class=nm>﴿${f+i}﴾</span>`).join(' ');
const B=(t,a,c='')=>`<button class="b ${c}" onclick="A('${a}')">${t}</button>`;
const Ch=(t,a,on)=>`<button class="ch${on?' on':''}" onclick="A('${a}')">${t}</button>`;
const bar=p=>`<div class=bar><i style="width:${Math.round(cl(p,0,1)*100)}%"></i></div>`;
const bd=(t,c='')=>`<span class="bd ${c}">${t}</span>`;
const hd=(t,b=1)=>`<div class=hd>${b?'<button class=bk onclick="A(\'back\')">‹</button>':''}<h3>${t}</h3></div>`;
const SP=(l,v,k)=>`<div class=sp><span>${l}</span><button onclick="A('${k}:-1')">−</button><b>${v}</b><button onclick="A('${k}:1')">+</button></div>`;
const TG=(on,a)=>`<button class="tg${on?' on':''}" onclick="A('${a}')" aria-label="ubah"></button>`;
const ring=(p,l,sz=110)=>{const r=sz/2-9,c=2*Math.PI*r;return `<svg width=${sz} height=${sz}><circle cx=${sz/2} cy=${sz/2} r=${r} fill=none stroke="var(--ln)" stroke-width=9 /><circle cx=${sz/2} cy=${sz/2} r=${r} fill=none stroke="var(--au)" stroke-width=9 stroke-linecap=round stroke-dasharray="${c*cl(p,0,1)} ${c}" transform="rotate(-90 ${sz/2} ${sz/2})"/><text x=50% y=50% text-anchor=middle dominant-baseline=central fill="var(--t)" font-size=${sz>120?30:20} font-weight=700>${l}</text></svg>`};
const sel=(a,k)=>SU.map((s,i)=>Ch(s.n,k+':'+i,a==i)).join('');
const toast=m=>{S.ts=m;R();setTimeout(()=>{S.ts='';R()},2200)};
const prev=()=>toast('Preview: belum terhubung ke backend');
const log=t=>LG.unshift({t,d:'Baru saja'});
const pend=()=>M.filter(x=>x.st!='lancar').length;

function home(){return `<div class=hero><small>${dt()}</small><h2>Assalamu'alaikum, ${G.name}</h2><p>Semoga hari ini ringan. Hafalan terjaga oleh pengulangan kecil yang rutin, bukan oleh satu hari yang berat.</p></div>
<div class="card row">${ring(G.today/G.tgt,G.today+'/'+G.tgt)}<div style="flex:1"><b>Target hari ini</b><p class=mu>${G.today} dari ${G.tgt} ayat</p><p>Total dihafal: <b>${G.tot} ayat</b></p><p>Sedang dipelajari: <b>${SU[H.s].n}</b></p></div></div>
<div class=grid style="grid-template-columns:1fr 1fr"><div class=card><small>Progres tilawah</small><b> ${G.til}%</b>${bar(G.til/100)}</div><div class=card><small>Perlu muraja'ah</small><h3>${pend()} ayat</h3></div></div>
<h4>Lanjutkan</h4>${B('Lanjutkan hafalan','go:hafal')}${B('Lanjutkan tilawah','go:tilawah','o')}${B('Lanjutkan muraja\'ah','go:muraja','o')}
<h4>Akses cepat</h4><div class=grid>${[['📖','Tilawah','go:tilawah'],['🧠','Hafalan','go:hafal'],['🔁','Muraja\'ah','go:muraja'],['🏆','LCC','tab:lcc'],['✨','Tajwid','go:tajwid'],['🎓','Sertifikasi','go:sert']].map(x=>`<button class=tile onclick="A('${x[2]}')"><i>${x[0]}</i>${x[1]}</button>`).join('')}</div>
<div class=card style="margin-top:14px"><b>Pengingat</b><p class=mu>Kutipan ayat dan hadis akan tampil dengan sumber yang jelas setelah konten diverifikasi. Untuk sementara: sisihkan 10 menit hari ini untuk satu muraja'ah.</p></div>`}
function learn(){return `<h2 style="margin-bottom:12px">Belajar</h2><h4 style="margin-top:0">Tilawah</h4>
${[['Tilawah bebas','Pilih surah dan ayat, baca dalam tampilan mushaf','bebas'],['Tilawah dengan waktu','Timer 10, 15, 30, atau 60 menit','waktu'],['Tilawah berdasarkan target','Target ayat, halaman, atau surah','target']].map(x=>`<div class="card row" onclick="A('tl:${x[2]}')" style="cursor:pointer"><div style="flex:1"><b>${x[0]}</b><p class=mu>${x[1]}</p></div>›</div>`).join('')}
<h4>Hafalan</h4><div class="card row" onclick="A('go:hafal')" style="cursor:pointer;border-color:var(--au)"><div style="flex:1"><b>Mulai hafalan</b><p class=mu>Pilih ayat, ulangi, uji, rekam, lalu muraja'ah. Focus Mode tersedia sebelum sesi.</p></div>›</div>
<div class="card row" onclick="A('go:muraja')" style="cursor:pointer"><div style="flex:1"><b>Muraja'ah</b><p class=mu>${pend()} ayat perlu diulang</p></div>›</div>
<h4>Tajwid</h4><div class="card row" onclick="A('go:tajwid')" style="cursor:pointer"><div style="flex:1"><b>Belajar tajwid</b><p class=mu>Ringkasan hukum bacaan dan latihan</p></div>›</div>`}
function lcc(){return `<h2 style="margin-bottom:4px">LCC Al-Qur'an</h2><p class=mu>Latihan cerdas cermat. Soal memakai surah contoh (Al-Fatihah dan Al-Ikhlas).</p>
${[['🔗','Sambung Ayat','Pilih kelanjutan atau kata yang hilang','sambung'],['🔍','Tebak Ayat','Tebak surah dan nomor ayat','tebak'],['🧩','Susun Ayat','Urutkan potongan ayat acak','susun'],['📚','Tebak Hukum Bacaan','Nun sukun, mim sukun, mad, dan lainnya','hukum'],['⏱️','Tantangan Waktu','60 detik, skor, dan streak','tantang']].map(x=>`<div class="card row" onclick="A('q:${x[3]}')" style="cursor:pointer"><span style="font-size:28px">${x[0]}</span><div style="flex:1"><b>${x[1]}</b><p class=mu>${x[2]}</p></div>›</div>`).join('')}`}
function prof(){const sc=C.own.length;return `<div class=card style="text-align:center"><div style="width:72px;height:72px;border-radius:50%;background:var(--g);color:#fff;font:700 28px Fraunces;display:grid;place-items:center;margin:0 auto 8px">${G.name.split(' ').map(w=>w[0]).join('')}</div><h3>${G.name}</h3><p class=mu>ahmad@contoh.id · akun contoh</p></div>
<div class=grid><div class=card style="text-align:center"><h3>${G.tot}</h3><small>ayat hafal</small></div><div class=card style="text-align:center"><h3>6</h3><small>hari beruntun</small></div><div class=card style="text-align:center"><h3>${sc}</h3><small>sertifikat</small></div></div>
<h4>Riwayat aktivitas</h4><div class=card>${LG.slice(0,5).map(x=>`<div class="row sp2" style="padding:5px 0"><span>${x.t}</span><small>${x.d}</small></div>`).join('')}</div>
<div class="card row" onclick="A('go:sert')" style="cursor:pointer"><div style="flex:1"><b>Sertifikat saya</b><p class=mu>${sc?sc+' sertifikat':'Belum ada sertifikat'}</p></div>›</div>
<h4>Pengaturan</h4><div class=card><div class="row sp2"><span>Notifikasi</span>${TG(P.notif,'pf:notif')}</div><div class="row sp2" style="margin-top:12px"><span>Pengingat muraja'ah</span>${TG(P.rem,'pf:rem')}</div></div>
<div class=card><b>Tampilan</b>${SP('Ukuran huruf Arab',parseInt(getComputedStyle(document.documentElement).getPropertyValue('--az')),'az')}<div style="margin-top:6px">${Ch('Otomatis','th:auto',P.th=='auto')}${Ch('Terang','th:light',P.th=='light')}${Ch('Gelap','th:dark',P.th=='dark')}</div></div><p class=mu style="text-align:center">Prototype HifzFlow · data contoh</p>`}

function tilawah(){const n=SU[T.s].a.length;let b='';
if(T.m=='bebas')b=`<div class=card><b>Surah</b><div style="margin-top:8px">${sel(T.s,'ts')}</div>${SP('Ayat awal',T.f,'tz:f')}${SP('Ayat akhir',T.t,'tz:t')}</div><div class=mush><div class=ar>${ay(T.s,T.p,T.p)}</div></div><div class="row sp2"><button class=ch onclick="A('tp:-1')">‹ Sebelumnya</button><small>Ayat ${T.p} · ${T.f}–${T.t}</small><button class=ch onclick="A('tp:1')">Berikutnya ›</button></div>${bar((T.p-T.f+1)/(T.t-T.f+1))}<small>Progres bacaan ${Math.round((T.p-T.f+1)/(T.t-T.f+1)*100)}%</small>`;
else if(T.m=='waktu')b=`<div style="text-align:center">${[10,15,30,60].map(x=>Ch(x+' menit','tmin:'+x,T.min==x)).join('')}</div><div style="text-align:center;margin:10px 0">${ring(T.left/(T.min*60),mm(T.left),190)}</div><p class=mu style="text-align:center">${T.run?'Sedang berjalan':T.el?'Dijeda':'Siap dimulai'} · terbaca ${mm(T.el)}</p>${B(T.run?'Jeda':T.el?'Lanjutkan':'Mulai','trun')}${B('Akhiri sesi','tend','o')}`;

 for(let i=1;i<=n;i++)for(let j=1;j<=m;j++){const a=D[i-1][j-1]+sc(i-1,j-1),b=D[i-1][j]+1,c=D[i][j-1]+1,mn=Math.min(a,b,c);D[i][j]=mn;P[i][j]=mn==a?0:mn==b?1:2}
 let i=n,j=m,extra=0;
 while(i>0||j>0){const p=(i>0&&j>0)?P[i][j]:(i>0?1:2);
  if(p==0){const q=sim(T[i-1].k,Hh[j-1]);T[i-1].heard=Hh[j-1];T[i-1].st=q>=.85?'ok':q>=.6?'near':'bad';i--;j--}
