name: Build APK
on:
  push:
    branches: [main, redesign-murottal-tajwid]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android scaffold and apply app code
        run: |
          flutter create --org com.fokus --project-name fokus_hafalan --platforms android .
          # google_fonts 9 uses material_ui.TextTheme; this app uses Flutter's TextTheme.
          flutter pub add speech_to_text:^7.0.0 google_fonts:8.2.1 http path_provider just_audio
          rm -f test/widget_test.dart
          rm -rf lib && mkdir lib
          cp -r app/lib/. lib/
          mkdir -p android/app/src/main/kotlin/com/fokus/fokus_hafalan
          cp app/MainActivity.kt android/app/src/main/kotlin/com/fokus/fokus_hafalan/MainActivity.kt
          M=android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a <uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.INTERNET"/>' $M
          if grep -q '<queries>' $M; then sed -i '/<queries>/a <intent><action android:name="android.speech.RecognitionService"/></intent>' $M; fi
          sed -i 's/android:label="fokus_hafalan"/android:label="HifzFlow"/' $M
      - run: flutter build apk --release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
