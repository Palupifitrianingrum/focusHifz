          b = `<div class=mush style="min-height:70px"><div class=ar style="font-size:26px">${ch.length ? Q.seq.map((i) => `<button class=ch style="font:inherit" onclick="A('un:${i}')" ${a ? "disabled" : ""}>${q.ws[i]}</button>`).join("") : "<small>Ketuk potongan di bawah</small>"}</div></div><div class=ar style="font-size:26px">${q.ws.map((w, i) => (Q.seq.includes(i) ? "" : `<button class=ch style="font:inherit" onclick="A('ad:${i}')">${w}</button>`)).join("")}</div>${a ? `<div class="card" style="background:${Q.sel ? "#d5efe1" : "#f6d6d2"};color:#222;margin-top:8px"><b>${Q.sel ? "Benar" : "Kurang tepat"}</b><div class=ar style="font-size:24px">${q.ans}</div></div>` : B("Periksa", "chk").replace("<button", "<button " + (Q.seq.length == q.ws.length ? "" : "disabled"))}`;
        }
        return `${hd(QN[Q.k])}<div class="row sp2"><small>Soal ${Q.i + 1}/${Q.l.length}</small>${tm ? `<span>${bd("⏱ " + Q.left + "d", "y")} ${bd("Streak " + Q.st, "g")} ${bd("Benar " + Q.ok)}` : ""}</span></div>${bar((Q.i + 1) / Q.l.length)}<p><b>${q.q}</b></p>${q.ar ? `<div class=mush><div class=ar>${q.ar}</div></div>` : ""}${b}${a ? B(Q.i + 1 >= Q.l.length ? "Lihat hasil" : "Lanjut", "nx") : ""}`;
      }
      function fin() {
        Q.done = 1;
        Q.dur = Math.round((Date.now() - Q.t0) / 1000);
        const ex = Q.k == "ujian",
          pc = Q.ok / Q.l.length;
        if (ex) {
          C.hist.unshift({
            t: "Ujian Sambung Ayat · Level 1",
            r:
              Math.round(pc * 100) +
              "% · " +
              (pc >= 0.6 ? "Lulus" : "Belum lulus"),
            d: dt(),
          });
          if (pc >= 0.6 && !C.own.length)
            C.own.push({
              lv: 0,
              d: dt(),
              no:
                "HF-" +
                new Date().getFullYear() +
                "-" +
                String(1000 + Math.floor(Math.random() * 9000)),
            });
        }
        log(QN[Q.k] + ": " + Q.ok + "/" + Q.l.length + " benar");
        S.scr = "res";
      }
      function res() {
        const n = Q.l.length,
          pc = Math.round((Q.ok / n) * 100),
          ex = Q.k == "ujian",
          pass = ex && pc >= 60,
          tt = [...new Set(Q.bad.map((x) => x.top))];
        return `<div class=card style="text-align:center;margin-top:10px"><small>${QN[Q.k]}</small><div class=big>${Q.k == "tantang" ? Q.ok * 10 + Q.best * 2 + " poin" : pc + "%"}</div><p>${Q.ok} benar · ${Q.no} salah${Q.k == "tantang" ? ` · ${n - Q.ok - Q.no} tidak sempat` : ""} · ${mm(Q.dur)}${Q.k == "tantang" ? ` · streak terbaik ${Q.best}` : ""}</p>${ex ? bd(pass ? "Lulus" : "Belum lulus", pass ? "g" : "r") : ""}</div>
<h4>Materi yang perlu dipelajari</h4>${tt.length ? `<div class=card>${tt.map((x) => bd(x, "y")).join(" ")}</div>` : "<div class=card><p class=mu>Tidak ada. Bagus!</p></div>"}
${Q.bad.length ? `<h4>Pelajari kesalahan</h4>` + Q.bad.map((x) => `<div class=card><div class=ar style="font-size:22px;line-height:1.8">${x.ar || x.ans}</div><small>${x.q}</small><p>Jawaban benar: <b class=ar style="font-size:20px">${x.ty == "o" ? x.o[x.a] : x.ans}</b></p></div>`).join("") : ""}
${pass ? B("Lihat sertifikat", "cert", "au") : ""}${B("Coba lagi", "retry")}${B(ex ? "Kembali ke Sertifikasi" : "Kembali ke LCC", "after", "o")}${Q.bad.some((x) => HP.includes(x.top)) ? B("Pelajari tajwid", "go:tajwid", "o") : ""}`;
      }
      function qr(s) {
        let h = 0;
        for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0;
        let r = "";
        for (let y = 0; y < 21; y++)
          for (let x = 0; x < 21; x++) {
            let on;
            if ((x < 7 || x > 13) && (y < 7 || y > 13) && !(x > 13 && y > 13)) {
              const a = x < 7 ? x : x - 14,
                b = y < 7 ? y : y - 14;
              on =
                a == 0 ||
                a == 6 ||
                b == 0 ||
                b == 6 ||
                (a > 1 && a < 5 && b > 1 && b < 5);
            } else {
              h = (h * 1103515245 + 12345) >>> 0;
              on = (h >> 16) & 1;
            }
            if (on) r += `<rect x=${x} y=${y} width=1 height=1 />`;
          }
        return `<svg viewBox="0 0 21 21" width=96 height=96 fill="#0a3d31">${r}</svg>`;
      }
      function cert() {
        const c = C.own[S.ec] || C.own[0];
        return (
          hd("Sertifikat") +
          `<div class=cert><small>focusHifz · Sertifikat kompetensi internal</small><h2 style="margin:10px 0">Sertifikat Kompetensi</h2><p>diberikan kepada</p><h3 style="font-size:24px">${G.name}</h3><p>atas capaian <b>${L[c.lv].n}</b></p><p>Tanggal terbit: ${c.d}</p><p>Nomor: ${c.no} <small>(contoh)</small></p><div style="display:flex;justify-content:center;margin:10px 0">${qr(c.no)}</div><small>QR contoh, belum terhubung ke layanan verifikasi</small></div><p class=mu style="font-size:13px">Sertifikat ini adalah sertifikasi kompetensi internal focusHifz. Bukan ijazah dan bukan sanad Al-Qur'an.</p>${B("Bagikan (preview)", "prev", "o")}`
        );
      }
      function sert() {
        const l = L[S.sl],
          dn = l.rq.filter((x) => x[1]()).length;
        return (
          hd("Sertifikasi") +
          `<div class=card style="border-color:var(--au)"><b>Sertifikasi kompetensi internal</b><p class=mu>Program penilaian kemampuan hafalan di focusHifz. Bukan ijazah dan bukan sanad Al-Qur'an. Jenjang dapat berubah sesuai kurikulum.</p></div>
<h4>Jenjang</h4>${L.map((x, i) => `<div class=card onclick="A('sl:${i}')" style="cursor:pointer;${S.sl == i ? "border-color:var(--g)" : ""}"><div class="row sp2"><b>${x.n}</b>${x.lock ? bd("Segera") : bd(C.own.some((c) => c.lv == i) ? "Diraih" : "Terbuka", C.own.some((c) => c.lv == i) ? "g" : "y")}</div><p class=mu>${x.d}</p></div>`).join("")}
${l.lock ? "" : `<h4>Persyaratan & progres</h4><div class=card>${bar(dn / l.rq.length)}${l.rq.map((x) => `<p>${x[1]() ? "✅" : "⬜"} ${x[0]}</p>`).join("")}</div>${B("Ikut ujian", "go:sertex")}`}
<h4>Riwayat ujian</h4>${C.hist.length ? C.hist.map((x) => `<div class=card><b>${x.t}</b><p class=mu>${x.r} · ${x.d}</p></div>`).join("") : '<div class="card emp">Belum ada ujian. Mulai dari Level 1.</div>'}
<h4>Sertifikat saya</h4>${C.own.length ? C.own.map((x, i) => `<div class="card row" onclick="A('cert:${i}')" style="cursor:pointer"><span style="font-size:26px">🎓</span><div style="flex:1"><b>${L[x.lv].n}</b><p class=mu>${x.no} · ${x.d}</p></div>›</div>`).join("") : '<div class="card emp">Belum ada sertifikat.</div>'}`
        );
      }
      function sertex() {
        return (
          hd("Ujian Level 1") +
          `<p class=mu>Pilih jenis ujian. Lulus ujian sambung ayat (≥60%) menerbitkan sertifikat contoh.</p>${[
            [
              "Ujian sambung ayat",
              "5 soal sambung ayat. Sudah berfungsi.",
              "q:ujian",
            ],
            ["Ujian hafalan", "Setor hafalan ke penguji. Preview.", "pv"],
            ["Ujian kelancaran", "Penilaian kelancaran bacaan. Preview.", "pv"],
            [
              "Penilaian penguji manusia",
              "Penguji menilai rekaman Anda. Preview.",
              "pv",
            ],
          ]
            .map(
              (x) =>
                `<div class="card row" onclick="A('${x[2]}')" style="cursor:pointer"><div style="flex:1"><b>${x[0]}</b><p class=mu>${x[1]}</p></div>›</div>`,
            )
            .join("")}`
        );
      }

      const mkH = (o) =>
        Object.assign(
          {
            st: "pick",
            s: 0,
            f: 1,
            t: 3,
            rep: 5,
            cu: 0,
            focus: 0,
            c: 0,
            hide: 0,
            peek: 0,
            rec: 0,
            rt: 0,
            mk: {},
            ab: 0,
          },
          o,
        );
      const mkQ = (o) =>
        Object.assign(
          {
            k: "sambung",
            l: [],
            i: 0,
            ok: 0,
            no: 0,
            st: 0,
            best: 0,
            t0: 0,
            sel: null,
            seq: [],
            left: 60,
            done: 0,
            bad: [],
            dur: 0,
          },
          o,
        );
      const qS = {
        ty: "o",
        q: "Pilih kelanjutan ayat",
        ar: "الْحَمْدُ لِلَّهِ …",
        o: [
          "رَبِّ الْعَالَمِينَ",
          "الرَّحْمَٰنِ الرَّحِيمِ",
          "مَالِكِ يَوْمِ الدِّينِ",
          "اللَّهُ الصَّمَدُ",
        ],
        a: 0,
        top: "Al-Fatihah",
      };
      const qU = {
        ty: "s",
        q: "Susun potongan menjadi ayat yang benar",
        ws: ["وَلَمْ", "لَمْ", "يُولَدْ", "يَلِدْ"],
        ans: "لَمْ يَلِدْ وَلَمْ يُولَدْ",
        top: "Al-Ikhlas",
      };
      C.own = [{ lv: 0, d: "17 November 2026", no: "HF-2026-4821" }];
      C.hist = [
        {
          t: "Ujian Sambung Ayat · Level 1",
          r: "80% · Lulus",
          d: "17 November 2026",
        },
      ];
      const tab = (t) => () => {
        S.tab = t;
        S.scr = "";
        S.m = null;
      };
      const scr = (s, f) => () => {
        S.scr = s;
        S.m = null;
        f && f();
      };
      const mod = (m) => {
        S.m = m;
      };
      const askM = {
        t: "Akhiri sesi hafalan?",
        b: "Sesi dihentikan dan progres sesi ini tidak disimpan. Focus Mode akan dimatikan dan pengaturan fokus dipulihkan (simulasi).",
        bt: [
          ["Lanjutkan sesi", "mclose", "o"],
          ["Akhiri sesi", "endH", "rd"],
        ],
      };
      const SECS = [
        [
          "Navigasi utama (tab bar)",
          [
            ["01 · Beranda", tab("home")],
            ["02 · Belajar", tab("learn")],
            ["03 · LCC", tab("lcc")],
            ["04 · Profil", tab("prof")],
          ],
        ],
        [
          "Tilawah",
          [
            [
              "05 · Tilawah · Bebas",
              scr("tilawah", () => {
                T = { ...T, m: "bebas", s: 0, f: 1, t: 7, p: 3 };
              }),
            ],
            [
              "06 · Tilawah · Waktu",
              scr("tilawah", () => {
                T = { ...T, m: "waktu", min: 15, left: 612, el: 288, run: 1 };
              }),
            ],
            [
              "07 · Tilawah · Target",
              scr("tilawah", () => {
                T = { ...T, m: "target", u: "Ayat", n: 5, d: 2 };
              }),
            ],
          ],
        ],
        [
          "Muraja'ah",
          [
            [
              "08 · Muraja'ah · Daftar",
              scr("muraja", () => {
                F = "all";
              }),
            ],
            [
              "09 · Muraja'ah · Filter 'Perlu diulang'",
              scr("muraja", () => {
                F = "ulang";
              }),
            ],
            [
              "10 · Muraja'ah · Detail ayat (bottom sheet)",
              scr("muraja", () => {
                F = "all";
                mod({
                  t: "Al-Fatihah : 2",
                  h: "<div class=ar>" + SU[0].a[1] + "</div>",
                  bt: [
                    ["Tandai lancar", "x"],
                    ["Perlu diulang", "x", "o"],
                    ["Tutup", "x", "o"],
                  ],
                });
              }),
            ],
          ],
        ],
        [
          "Hafalan",
          [
            [
              "11 · Hafalan · 1 Pilih ayat",
              scr("hafal", () => {
                H = mkH({});
              }),
            ],
            [
              "12 · Hafalan · 2 Atur pengulangan",
              scr("hafal", () => {
                H = mkH({ st: "set", focus: 1 });
              }),
            ],
            [
              "13 · Hafalan · 3 Ulangi",
              scr("hafal", () => {
                H = mkH({ st: "rep", c: 3, focus: 1 });
              }),
            ],
            [
              "14 · Hafalan · 4 Uji (ayat tampil)",
              scr("hafal", () => {
                H = mkH({ st: "test", c: 5 });
              }),
            ],
            [
              "15 · Hafalan · 4 Uji (ayat disembunyikan)",
              scr("hafal", () => {
                H = mkH({ st: "test", c: 5, hide: 1 });
              }),
            ],
            [
              "16 · Hafalan · 5 Rekam",
              scr("hafal", () => {
                H = mkH({ st: "rec", rec: 1, rt: 23 });
              }),
            ],
            [
              "17 · Hafalan · 6 Evaluasi",
              scr("hafal", () => {
                H = mkH({ st: "eval", mk: { 1: "g", 2: "y", 3: "r" } });
              }),
            ],
            [
              "18 · Hafalan · Sesi selesai",
              scr("hafal", () => {
                H = mkH({ st: "done", focus: 1 });
              }),
            ],
            [
              "19 · Hafalan · Dialog akhiri sesi",
              scr("hafal", () => {
                H = mkH({ st: "rep", c: 3, focus: 1 });
                mod(askM);
              }),
            ],
          ],
        ],
        [
          "Tajwid",
          [
            [
              "20 · Belajar Tajwid",
              scr("tajwid", () => {
                S.tj = 0;
              }),
            ],
          ],
        ],
        [
          "LCC / Kuis",
          [
            [
              "21 · Kuis · Sambung Ayat",
              scr("quiz", () => {
                Q = mkQ({ k: "sambung", l: Array(5).fill(qS) });
              }),
            ],
            [
              "22 · Kuis · Jawaban benar",
              scr("quiz", () => {
                Q = mkQ({
                  k: "sambung",
                  l: Array(5).fill(qS),
                  ok: 1,
                  st: 1,
                  sel: 0,
                });
              }),
            ],
            [
              "23 · Kuis · Jawaban salah",
              scr("quiz", () => {
                Q = mkQ({ k: "sambung", l: Array(5).fill(qS), no: 1, sel: 2 });
              }),
            ],
            [
              "24 · Kuis · Susun Ayat",
              scr("quiz", () => {
                Q = mkQ({ k: "susun", l: Array(4).fill(qU), seq: [1, 3] });
              }),
            ],
            [
              "25 · Kuis · Tantangan Waktu",
              scr("quiz", () => {
                Q = mkQ({
                  k: "tantang",
                  l: Array(12).fill(qS),
                  i: 4,
                  ok: 3,
                  no: 1,
                  st: 2,
                  best: 3,
                  left: 42,
                });
              }),
            ],
            [
              "26 · Hasil kuis (lulus ujian)",
              scr("res", () => {
                Q = mkQ({
                  k: "ujian",
                  l: Array(5).fill(qS),
                  ok: 4,
                  no: 1,
                  dur: 95,
                  done: 1,
                  bad: [qS],
                });
              }),
            ],
            [
              "27 · Hasil kuis (tantangan waktu)",
              scr("res", () => {
                Q = mkQ({
                  k: "tantang",
                  l: Array(12).fill(qS),
                  ok: 8,
                  no: 2,
                  best: 5,
                  dur: 60,
                  done: 1,
                  bad: [qS],
                });
              }),
            ],
          ],
        ],
        [
          "Sertifikasi",
          [
            [
              "28 · Sertifikasi",
              scr("sert", () => {
                S.sl = 0;
              }),
            ],
            ["29 · Ujian Level 1", scr("sertex")],
            [
              "30 · Sertifikat",
              scr("cert", () => {
                S.ec = 0;
              }),
            ],
          ],
        ],
        [
          "Varian tema gelap",
          [
            ["31 · Beranda (gelap)", tab("home"), 1],
            ["32 · Profil (gelap)", tab("prof"), 1],
            [
              "33 · Hafalan · Ulangi (gelap)",
              scr("hafal", () => {
                H = mkH({ st: "rep", c: 3, focus: 1 });
              }),
              1,
            ],
          ],
        ],
      ];
      function pageHTML() {
        const map = {
          "": () => ({ home, learn, lcc, prof })[S.tab](),
          tilawah,
          muraja,
          hafal,
          tajwid,
          quiz,
          res,
          sert,
          sertex,
          cert,
        };
        return map[S.scr]();
      }
      function shell(pg, dark) {
        const m = S.m
          ? `<div class=ov><div class=sh><h3>${S.m.t}</h3>${S.m.b ? `<p>${S.m.b}</p>` : ""}${S.m.h || ""}${(S.m.bt || [["Tutup", "x"]]).map((x) => B(x[0], x[1], x[2] || "")).join("")}</div></div>`
          : "";
        const nav = S.scr
          ? ""
          : `<nav>${[
              ["home", "🏠", "Beranda"],
              ["learn", "📖", "Belajar"],
              ["lcc", "🏆", "LCC"],
              ["prof", "👤", "Profil"],
            ]
              .map(
                (x) =>
                  `<button class="${S.tab == x[0] ? "on" : ""}"><i>${x[1]}</i>${x[2]}</button>`,
              )
              .join("")}</nav>`;
        return `<div class="app${dark ? " dark" : ""}"><div class=v>${pg}</div>${nav}${m}</div>`;
      }
      let out = "";
      SECS.forEach(([name, list]) => {
        out += `<section class=sec><h2>${name}</h2><div class=grid4>`;
        list.forEach(([title, setup, dark]) => {
          S = {
            tab: "home",
            scr: "",
            st: [],
            m: null,
            ts: "",
            tj: -1,
            sl: 0,
            ec: 0,
          };
          setup();
          let pg = pageHTML(),
            k = 0;
          pg = pg.replace(
            /<i style="animation-delay:[^"]*">/g,
            () =>
              `<i style="height:${Math.round(14 + Math.abs(Math.sin(k++ * 0.75)) * 46)}px">`,
          );
          out += `<figure class=fr><figcaption>${title}</figcaption>${shell(pg, dark)}</figure>`;
        });
        out += "</div></section>";
      });
      document.getElementById("gallery").innerHTML = out;
    </script>
  </body>
